[static_params]
approximant = TaylorF2
f_lower = 20
f_final = 800

[variable_params]
q =
tau0 =
spin1z =
spin2z =

[prior-tau0]
name = uniform
min-tau0 = 1000
max-tau0 = 1001

[prior-q]
name = uniform
min-q = 1
max-q = 2.0

# Aligned spin, which is what widens the bank: at fixed tau0 and q the
# templates previously differed in one direction only.
[prior-spin1z]
name = uniform
min-spin1z = -0.2
max-spin1z = 0.2

[prior-spin2z]
name = uniform
min-spin2z = -0.2
max-spin2z = 0.2

[waveform_transforms-mchirp]
name = custom
inputs = tau0, q
mchirp = mchirp_from_tau0(tau0, 10)

[waveform_transforms-mass1+mass2]
name = custom
inputs = mchirp, q
mass1 = mass1_from_mchirp_q(mchirp, q)
mass2 = mass2_from_mchirp_q(mchirp, q)
